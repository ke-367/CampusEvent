{% extends "base.html" %}
{% block title %}登录 · CampusEvent{% endblock %}
{% block content %}
<div class="page-head">
  <h1>选择演示身份</h1>
  <p class="muted">课程演示环境使用固定账号，不实现注册与复杂权限系统（附录 B.1）。</p>
</div>

<div class="grid-2">
  <section class="card">
    <h2>学生登录</h2>
    <form method="post" class="stack">
      <input type="hidden" name="role" value="student">
      <label>学号
        <select name="student_no" required>
          {% for s in students %}
            <option value="{{ s.student_no }}">{{ s.student_no }} · {{ s.name }}</option>
          {% endfor %}
        </select>
      </label>
      <button class="btn primary" type="submit">以学生身份进入</button>
    </form>
  </section>

  <section class="card">
    <h2>管理员登录</h2>
    <form method="post" class="stack">
      <input type="hidden" name="role" value="admin">
      <label>管理员口令
        <input type="password" name="admin_code" placeholder="默认 admin123" required>
      </label>
      <button class="btn" type="submit">进入管理后台</button>
    </form>
    <p class="hint">管理员可发布/下架活动、审批报名、查看通知失败留痕。</p>
  </section>
</div>
{% endblock %}
